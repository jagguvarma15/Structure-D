# Prometheus configuration for Structure-D
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "structure-d-api"
    static_configs:
      - targets: ["api:9090"]

  - job_name: "vllm"
    static_configs:
      - targets: ["vllm:8000"]
    metrics_path: "/metrics"
