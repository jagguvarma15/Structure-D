# ──────────────────────────────────────────────────────────────
# Structure-D – default configuration
# ──────────────────────────────────────────────────────────────

# ── General ──────────────────────────────────────────────────
project_name: "structure-d"
log_level: "INFO"               # DEBUG | INFO | WARNING | ERROR
log_format: "json"              # json | console

# ── Ingestion ────────────────────────────────────────────────
ingestion:
  default_parser: "auto"        # auto | pymupdf | pdfplumber | unstructured | docling
  ocr_enabled: true
  ocr_engine: "tesseract"       # tesseract | easyocr
  ocr_languages: ["eng"]
  max_file_size_mb: 200
  supported_extensions:
    - ".pdf"
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".tiff"
    - ".bmp"
    - ".html"
    - ".htm"
    - ".docx"
    - ".xlsx"
    - ".pptx"
    - ".eml"
    - ".txt"
    - ".csv"
    - ".md"
  connectors:
    local:
      enabled: true
    s3:
      enabled: false
      bucket: ""
      region: "us-east-1"
    gcs:
      enabled: false
      bucket: ""

# ── Pre-processing & Chunking ───────────────────────────────
preprocessing:
  normalize_unicode: true
  strip_boilerplate: true
  chunking:
    strategy: "semantic"        # fixed | sentence | semantic | heading
    max_tokens: 1024
    overlap_tokens: 128
    heading_level: 2            # used when strategy = heading

# ── Model Registry ───────────────────────────────────────────
models:
  registry_path: "configs/models.yaml"
  default_model: "meta-llama/Llama-3.1-8B-Instruct"
  embedding_model: "intfloat/e5-large-v2"

# ── LLM Inference ───────────────────────────────────────────
inference:
  provider:
    provider: "vllm"             # vllm | openai | anthropic | gemini | ollama
    # Optional: if the primary provider raises an error (e.g. vLLM not running),
    # requests are transparently retried on this fallback provider.
    # Set ANTHROPIC_API_KEY (or the relevant env var) and uncomment to enable.
    fallback_provider: null      # null | vllm | openai | anthropic | gemini | ollama
    vllm:
      api_base: "http://localhost:8000/v1"
      api_key: "EMPTY"            # vLLM uses a dummy key by default
      gpu_memory_utilization: 0.90
      max_model_len: 8192
      max_num_seqs: 256
      structured_output_backend: "auto"   # auto | xgrammar | guidance | outlines
      timeout_seconds: 120
      max_retries: 3
    openai:
      model: "gpt-4o"
      api_key: null                # Set via OPENAI_API_KEY env var
      base_url: null                # Optional custom base URL
    anthropic:
      model: "claude-3-5-sonnet-20241022"
      api_key: null                # Set via ANTHROPIC_API_KEY env var
    gemini:
      model: "gemini-1.5-pro"
      api_key: null                # Set via GOOGLE_API_KEY env var
    ollama:
      base_url: "http://localhost:11434"
      model: "llama3.1:8b"
  batch:
    max_batch_size: 32
    flush_interval_seconds: 1.0

# ── Structured Output & Validation ───────────────────────────
validation:
  strict_mode: true             # fail loudly on schema mismatches
  max_retries: 3
  retry_with_refined_prompt: true
  fallback_to_regex: true

# ── Retrieval / RAG ──────────────────────────────────────────
retrieval:
  enabled: false
  framework: "langchain"        # langchain | llama_index | haystack
  vector_store: "chroma"        # chroma | pgvector | milvus | faiss
  top_k: 5
  similarity_threshold: 0.75
  embedding_dimension: 1024
  chroma:
    persist_directory: "./data/chroma"
  pgvector:
    connection_string: "postgresql+asyncpg://user:pass@localhost:5432/structure_d"
  milvus:
    uri: "http://localhost:19530"

# ── Storage ──────────────────────────────────────────────────
storage:
  default_format: "jsonl"       # jsonl | csv | database
  output_directory: "./output"
  jsonl:
    indent: null                # null = compact, 2 = pretty
  csv:
    delimiter: ","
    quoting: "minimal"
  database:
    connection_string: "postgresql+asyncpg://user:pass@localhost:5432/structure_d"
    table_prefix: "sd_"

# ── API ──────────────────────────────────────────────────────
api:
  host: "0.0.0.0"
  port: 8080
  workers: 4
  cors_origins: ["*"]
  max_upload_size_mb: 200

# ── Monitoring ───────────────────────────────────────────────
monitoring:
  prometheus:
    enabled: true
    port: 9090
  logging:
    structured: true
    file: "./logs/structure_d.log"
    max_size_mb: 100
    backup_count: 5
