[project]
name = "structure-d"
version = "0.1.0"
description = "An open-source framework to ingest unstructured documents and reliably produce validated, schema-constrained structured data (JSON/CSV/DB), optimized for high-throughput inference with vLLM structured outputs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Jagadesh Varma Nadimpalli" },
]
keywords = [
    "unstructured-data",
    "structured-output",
    "vllm",
    "etl",
    "llm",
    "document-extraction",
    "rag",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiofiles>=24.1",
    "structlog>=24.1",
    "rich>=13.7",
    "click>=8.1",
    "tenacity>=8.2",
    "jsonschema>=4.21",
    "jinja2>=3.1",
    "prompt-toolkit>=3.0",
]

[project.optional-dependencies]
# PDF & document parsing
ingestion = [
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pdf2image>=1.17",
    "pytesseract>=0.3.10",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "python-pptx>=0.6",
    "unstructured[all-docs]>=0.15",
]

# vLLM inference
inference = [
    "openai>=1.30",
    "vllm>=0.6",
    "transformers>=4.40",
    "torch>=2.2",
]

# Retrieval & RAG
retrieval = [
    "langchain>=0.2",
    "langchain-community>=0.2",
    "llama-index>=0.10",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
]

# Storage
storage = [
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "psycopg2-binary>=2.9",
    "asyncmy>=0.2.7",  # MySQL async driver
]

# Cloud connectors (optional, install separately)
connectors = [
    "boto3>=1.34",
    "google-cloud-storage>=2.14",
    "azure-storage-blob>=12.19",
    "paramiko>=3.4",
]

# Cloud destinations (optional, install separately)
destinations = [
    "snowflake-connector-python>=3.7",
    "google-cloud-bigquery>=3.15",
]

# API serving
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

# Monitoring
monitoring = [
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
]

# Orchestration
orchestration = [
    "celery>=5.4",
    "redis>=5.0",
]

# All extras
all = [
    "structure-d[ingestion,inference,retrieval,storage,api,monitoring,orchestration]",
]

# Development
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
structure-d = "structure_d.cli:main"

[project.urls]
Homepage = "https://github.com/JagadeshVarma/Structure-D"
Repository = "https://github.com/JagadeshVarma/Structure-D"
Issues = "https://github.com/JagadeshVarma/Structure-D/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["structure_d"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["structure_d"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.basedpyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
venvPath = "."  # Look for venv in project root
venv = ".venv"  # Virtual environment directory name
reportMissingImports = "warning"  # Warn for missing imports (optional deps)
reportMissingTypeStubs = "none"   # Don't require type stubs for all packages
reportUnusedImport = "warning"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
